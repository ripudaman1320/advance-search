[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-rag-chatbot"
version = "0.1.0"
description = "Enterprise RAG system for personal email history"
requires-python = ">=3.12"
authors = [{name = "Your Name", email = "you@example.com"}]
dependencies = [
  "uvicorn[standard]>=0.24.0",
  "fastapi>=0.104.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.25.0",
  "torch>=2.0.0",
  "transformers>=4.30.0",
  "python-docx>=0.8.11",
  "langchain>=0.1.0",
  "langchain-text-splitters>=0.0.1",
  "chromadb>=0.4.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=2.2.2",
  "numpy>=1.26.0",
  "langchain-ollama>=0.1.0",
  "groq>=0.9.0",
  "gradio>=4.0.0",
  "sqlalchemy>=2.0.0",
  "ragas>=0.1.0",
  "scikit-learn>=1.4.0",
  "python-json-logger>=2.0.0",
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
  "black>=23.10.0",
  "ruff>=0.11.0",
  "mypy>=1.7.0",
  "ipython>=8.0.0",
]

[project.optional-dependencies]
# Core backend
core = [
    "uvicorn[standard]>=0.24.0",
    "fastapi>=0.104.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
]

rerank = [
    "torch>=2.0.0",
    "transformers>=4.30.0",  # For cross-encoder
]

# Ingestion
ingest = [
    "python-docx>=0.8.11",
    "langchain>=0.1.0",
    "langchain-text-splitters>=0.0.1",
]

# Retrieval & Vector DB
retrieval = [
    "chromadb>=0.4.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.2",
    "numpy>=1.26.0",
]

# LLM
llm = [
    "langchain-ollama>=0.1.0",
    "groq>=0.9.0",
]

# UI
ui = [
    "gradio>=4.0.0",
]

# Storage
storage = [
    "sqlalchemy>=2.0.0",
]

# Evaluation
eval = [
    "ragas>=0.1.0",
    "scikit-learn>=1.4.0",
]

# Observability
observability = [
    "python-json-logger>=2.0.0",
]

# Testing
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

# Development
dev = [
    "black>=23.10.0",
    "ruff>=0.11.0",
    "mypy>=1.7.0",
    "ipython>=8.0.0",
]

# All
all = [
    "email-rag-chatbot[core,ingest,retrieval,rerank,llm,ui,storage,eval,observability,test,dev]"
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
